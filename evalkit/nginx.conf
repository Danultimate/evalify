server {
    listen 80;
    server_name evalkit.danblanco.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name evalkit.danblanco.dev;

    ssl_certificate /etc/letsencrypt/live/evalkit.danblanco.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evalkit.danblanco.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/runs/ {
        proxy_pass http://localhost:80/api/runs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://localhost:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
