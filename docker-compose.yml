services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evalkit
      POSTGRES_PASSWORD: evalkit
      POSTGRES_DB: evalkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://evalkit:evalkit@db:5432/evalkit
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  seed:
    build: ./backend
    command: python seed.py
    environment:
      DATABASE_URL: postgresql://evalkit:evalkit@db:5432/evalkit
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
